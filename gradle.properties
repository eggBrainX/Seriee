# R8 and lint need headroom on top of the Compose toolchain. Keep the heap
# modest and run tasks in a single worker so the build also fits on 8 GB
# machines that are running an IDE at the same time.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=false
kotlin.daemon.jvmargs=-Xmx1024m
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
