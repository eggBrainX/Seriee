name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# Only one run may publish the rolling `debug-latest` release at a time.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Fail fast on release/tag builds if signing secrets are missing,
      # before spending time on a build that would be unsigned.
      - name: Check signing secrets (release only)
        if: github.ref_type == 'tag'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; cannot sign a release build."
            missing=1
          fi
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD is not set; cannot sign a release build."
            missing=1
          fi
          if [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "::error::ANDROID_KEY_ALIAS is not set; cannot sign a release build."
            missing=1
          fi
          if [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::ANDROID_KEY_PASSWORD is not set; cannot sign a release build."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "All signing secrets are set."

      # Restore the release keystore and keystore.properties that
      # app/build.gradle.kts expects (see keystore.properties.example).
      # Paths are repo-root relative to match rootProject.file("keystore.properties").
      - name: Restore release keystore
        if: github.ref_type == 'tag'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > seriee-release.keystore
          cat > keystore.properties <<EOF
          storeFile=seriee-release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          chmod 600 keystore.properties seriee-release.keystore
          echo "Keystore restored (storeFile=seriee-release.keystore)."

      - name: Build debug APK
        if: github.ref_type != 'tag'
        run: gradle assembleDebug --stacktrace

      - name: Build release APK
        if: github.ref_type == 'tag'
        run: gradle assembleRelease --stacktrace

      - name: Upload debug APK artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: seriee-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Name debug APK by version
        if: github.ref_type != 'tag'
        run: |
          VERSION=$(jq -r '.elements[0].versionName' app/build/outputs/apk/debug/output-metadata.json)
          APK="Seriee-${VERSION}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          echo "APK_NAME=$APK" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Publishing $APK"

      # Build the release body from the in-app changelog so it never goes stale.
      - name: Generate debug release notes
        if: github.ref_type != 'tag'
        run: |
          python3 - <<'PY'
          import json, os, xml.etree.ElementTree as ET

          version = os.environ["VERSION"]
          sha = os.environ["GITHUB_SHA"][:7]
          root = ET.parse("app/src/main/res/values/strings.xml").getroot()

          items = []
          index = 1
          while True:
              node = root.find(f"string[@name='changelog_{index}']")
              if node is None:
                  break
              text = "".join(node.itertext()).replace("\\'", "'").strip()
              items.append(text)
              index += 1

          lines = [
              f"### Seriee {version} — debug build",
              "",
              f"Built from commit `{sha}`.",
              "",
          ]
          if items:
              lines += ["**What's new**", ""]
              lines += [f"- {item}" for item in items]
              lines += [""]
          lines += [
              "Download the `.apk` asset below and install it directly.",
              "",
          ]
          with open("release-notes.md", "w", encoding="utf-8") as fh:
              fh.write("\n".join(lines))
          PY
          cat release-notes.md

      # Release assets are served as real files (not zipped), so this link
      # installs directly:
      - name: Publish debug APK to Releases
        if: github.ref_type != 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: Seriee debug (latest)
          prerelease: true
          files: ${{ env.APK_NAME }}
          body_path: release-notes.md

      - name: Upload release APK artifact
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: seriee-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      # Berjalan hanya saat push tag (mis. v1.0.1)
      - name: Rename APK for release
        if: github.ref_type == 'tag'
        run: cp app/build/outputs/apk/release/app-release.apk "Seriee-${{ github.ref_name }}.apk"

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Seriee ${{ github.ref_name }}
          files: Seriee-${{ github.ref_name }}.apk
          generate_release_notes: true

      # Rolling "Stable" channel: always points at the newest signed tag.
      # The tag is moved with PATCH (not deleted) so the release stays published.
      - name: Publish stable channel
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="Seriee-${GITHUB_REF_NAME}.apk"
          NOTES="stable-notes-${GITHUB_REF_NAME}.md"
          gh release view "$GITHUB_REF_NAME" --json body --jq '.body' > "$NOTES"

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/stable-latest" \
            -f sha="$GITHUB_SHA" -F force=true \
            || gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/stable-latest" -f sha="$GITHUB_SHA"

          if gh release view stable-latest >/dev/null 2>&1; then
            gh release edit stable-latest \
              --title "Seriee Stable (latest)" \
              --notes-file "$NOTES"
            gh release upload stable-latest "$APK" --clobber
            for asset in $(gh release view stable-latest --json assets --jq '.assets[].name'); do
              if [ "$asset" != "$APK" ]; then
                gh release delete-asset stable-latest "$asset" -y
              fi
            done
          else
            gh release create stable-latest "$APK" \
              --title "Seriee Stable (latest)" \
              --notes-file "$NOTES"
          fi
          echo "stable-latest now points at $GITHUB_REF_NAME."
