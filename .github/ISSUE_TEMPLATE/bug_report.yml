name: Bug report
description: Something is broken or behaves unexpectedly.
title: "bug: "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not include API keys, keystores, or
        personal data. Security issues belong in the private Security tab.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Library tab
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      # noinspection SpellCheckingInspection
      label: Seriee version
      description: Found in the overflow menu → About.
      placeholder: "0.3.0"
    validations:
      required: true
  - type: input
    id: android-version
    attributes:
      label: Android version and device
      placeholder: "Android 15, Pixel 8"
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: Install source
      options:
        - Signed release from GitHub Releases
        - Self-built debug APK
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Optional. Redact anything private.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This is not a security vulnerability.
          required: true
